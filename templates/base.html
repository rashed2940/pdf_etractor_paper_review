<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cybersecurity Paper Analyzer{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        🛡️ Cyber Paper Analyzer
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('results_page') }}">Results</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container mt-5 mb-4 text-muted small">
    <hr>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span>Cybersecurity Paper Analyzer · AGENTS.md §41 — Accuracy, Traceability, Grounded answers.</span>
      <span>Created by <strong class="text-body">Sk Rashed Bin Mohammad</strong></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
